<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b5d34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Muscu</title>
<style>
  :root {
    --vert:#2b5d34; --accent:#3c8f49; --doux:#eef5e7; --bord:#d9e4d2;
    --fond:#fff; --carte:#fff; --texte:#222; --gris:#666; --champ:#fff; --champbord:#b9c9b0; --rouge:#b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --vert:#1e4226; --accent:#6fbf73; --doux:#1c2a1d; --bord:#2a352a;
      --fond:#101310; --carte:#161b16; --texte:#e8ece8; --gris:#9aa59a; --champ:#1d241d; --champbord:#344234; --rouge:#ff8a80; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--texte); background:var(--fond); padding-bottom:calc(92px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:2; background:var(--vert); color:#fff; padding:calc(env(safe-area-inset-top) + 8px) 12px 10px; }
  .onglets { display:flex; gap:6px; }
  .onglets button { flex:1; font:inherit; border:0; border-radius:8px; padding:6px 0 5px; background:rgba(255,255,255,.14); color:#fff; line-height:1.15; }
  .onglets b { display:block; font-size:18px; }
  .onglets small { font-size:12px; opacity:.85; }
  .onglets button[aria-selected="true"] { background:#fff; color:#2b5d34; }
  #semaine { margin:8px 2px 0; font-size:14px; line-height:1.35; }
  .avance { height:4px; background:rgba(255,255,255,.2); border-radius:2px; margin-top:8px; overflow:hidden; }
  .avance i { display:block; height:100%; width:0; background:#fff; }
  main { padding:0 12px; max-width:560px; margin:0 auto; }

  .ex { padding:14px 0 12px; border-bottom:1px solid var(--bord); }
  .tete { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .ex h2 { font-size:17px; margin:0; line-height:1.25; }
  .ex.fini h2::before { content:"✓ "; color:var(--accent); }
  .cible { font-size:15px; font-weight:600; white-space:nowrap; color:var(--accent); }
  .info { font-size:13px; color:var(--gris); margin:3px 0 0; }
  .astuce { font-size:14px; background:var(--doux); border-left:3px solid var(--accent); padding:6px 8px; margin:8px 0 2px; border-radius:0 4px 4px 0; }

  .groupe { border-left:3px solid var(--accent); padding-left:10px; margin:6px 0 0; border-bottom:1px solid var(--bord); }
  .groupe > p { font-size:13px; font-weight:600; color:var(--accent); margin:12px 0 0; }
  .groupe .ex:last-child { border-bottom:0; }

  .series { margin-top:8px; }
  .serie { display:grid; grid-template-columns:22px 1fr 14px 1fr 48px; gap:6px; align-items:center; margin:5px 0; }
  .num { font-size:14px; color:var(--gris); text-align:center; }
  .x { color:var(--gris); text-align:center; }
  input { width:100%; font:inherit; font-size:17px; text-align:center; padding:9px 4px; border:1px solid var(--champbord); border-radius:8px; background:var(--champ); color:var(--texte); }
  input::placeholder { color:var(--gris); opacity:.7; }
  .ok { height:42px; font-size:20px; border:1px solid var(--champbord); border-radius:8px; background:var(--champ); color:var(--gris); }
  .serie.faite input { background:var(--doux); border-color:var(--accent); }
  .serie.faite .ok { background:var(--accent); border-color:var(--accent); color:#fff; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

  #minuteur { position:fixed; left:0; right:0; bottom:0; background:var(--carte); border-top:1px solid var(--bord); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); display:flex; gap:6px; align-items:center; }
  .temps { min-width:74px; line-height:1.1; }
  .temps small { display:block; font-size:12px; color:var(--gris); }
  #chrono { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  #chrono.fini { color:var(--rouge); }
  #minuteur button { flex:1; font:inherit; font-size:15px; padding:10px 0; border:1px solid var(--bord); background:var(--doux); border-radius:8px; color:var(--texte); }

  .prog h2 { font-size:17px; margin:20px 0 6px; }
  .prog p, .prog li { font-size:15px; line-height:1.45; }
  .prog input[type=date] { margin-top:6px; text-align:left; }
  .prog .actions { display:flex; flex-wrap:wrap; gap:8px; }
  .prog .actions button, .prog label.bouton { font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--accent); border-radius:8px; background:transparent; color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="onglets" role="tablist">
    <button role="tab" data-s="A"><b>A</b><small>lundi</small></button>
    <button role="tab" data-s="B"><b>B</b><small>mercredi</small></button>
    <button role="tab" data-s="C"><b>C</b><small>vendredi</small></button>
    <button role="tab" data-s="P"><b>Plan</b><small>règles</small></button>
  </div>
  <p id="semaine"></p>
  <div class="avance" id="avance" hidden><i></i></div>
</header>
<main id="app"></main>
<div id="minuteur">
  <div class="temps"><small>repos</small><output id="chrono">0:00</output></div>
  <button data-t="60">1:00</button><button data-t="90">1:30</button><button data-t="120">2:00</button><button data-t="180">3:00</button>
</div>

<script>
// leg = +5 kg au lieu de +2,5 kg ; petit = échec sur la dernière série en semaines 5-7 ; ss = superset (2 exercices qui se suivent)
const P = {
  A: [
    { id:'squat', n:'Squat barre', s:3, lo:6, hi:8, repos:180, leg:1 },
    { id:'couche', n:'Développé couché barre', s:3, lo:6, hi:8, repos:180 },
    { id:'tractions', n:'Tractions', s:4, lo:6, hi:10, repos:120 },
    { id:'legcurl', n:'Leg curl assis', s:3, lo:10, hi:12, repos:90, leg:1 },
    { id:'elev', n:'Élévations latérales', s:3, lo:12, hi:20, repos:60, petit:1 },
    { id:'curlinc', n:'Curl incliné', s:3, lo:10, hi:15, ss:1, petit:1 },
    { id:'tri', n:'Extension triceps poulie au-dessus de la tête', s:3, lo:10, hi:15, ss:1, petit:1 },
  ],
  B: [
    { id:'presse', n:'Presse à cuisses', s:3, lo:10, hi:12, repos:120, leg:1 },
    { id:'inclhalt', n:'Développé incliné haltères', s:3, lo:8, hi:12, repos:120 },
    { id:'row', n:'Row machine poitrine appuyée', s:4, lo:8, hi:12, repos:120 },
    { id:'hip', n:'Hip thrust', s:3, lo:8, hi:12, repos:120, leg:1 },
    { id:'dips', n:'Dips lestés', s:3, lo:6, hi:10, repos:120 },
    { id:'rfly', n:'Reverse fly', s:3, lo:15, hi:20, ss:1 },
    { id:'mollets', n:'Mollets debout', s:3, lo:15, hi:20, ss:1, leg:1, petit:1 },
  ],
  C: [
    { id:'bulgare', n:'Fentes bulgares haltères', s:3, lo:8, hi:12, repos:120, leg:1, note:'par jambe' },
    { id:'chest', n:'Chest press machine', s:3, lo:8, hi:12, repos:120 },
    { id:'tirage', n:'Tirage vertical', s:4, lo:8, hi:12, repos:120 },
    { id:'legext', n:'Leg extension', s:3, lo:12, hi:15, ss:1, leg:1, petit:1 },
    { id:'legcurl', n:'Leg curl assis', s:3, lo:12, hi:15, ss:1, leg:1 },
    { id:'epaules', n:'Développé épaules machine', s:2, lo:8, hi:12, repos:120 },
    { id:'elev', n:'Élévations latérales', s:3, lo:12, hi:15, ss:3, petit:1 },
    { id:'marteau', n:'Curl marteau', s:3, lo:12, hi:15, ss:3, petit:1 },
  ],
};

const CLE = 'muscu';
const D = JSON.parse(localStorage.getItem(CLE) || '{"log":{}}');
const sauver = () => localStorage.setItem(CLE, JSON.stringify(D));
const jour = d => d.toLocaleDateString('sv-SE'); // AAAA-MM-JJ en heure locale
const AUJ = jour(new Date());
function lundi(d) { const x = new Date(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return jour(x); }
if (!D.debut) { D.debut = lundi(new Date()); sauver(); }

function semaine() {
  const n = Math.max(0, Math.floor((new Date(AUJ) - new Date(D.debut)) / 864e5 / 7));
  return { cycle: Math.floor(n / 8) + 1, s: n % 8 + 1 };
}
const REGLE = s => s <= 2 ? "arrête-toi à 2 reps de l'échec."
  : s <= 4 ? "arrête-toi à 1 rep de l'échec."
  : s <= 7 ? "1 rep avant l'échec, échec sur la dernière série des petits exercices."
  : "semaine allégée : moitié moins de séries, mêmes charges.";
const REPOS = { 60:'1 min', 90:'1 min 30', 120:'2 min', 180:'3 min' };

function derniere(cle) {
  const h = D.log[cle] || {};
  const dates = Object.keys(h).filter(d => d < AUJ && h[d].some(x => x && x[1])).sort();
  return dates.length ? h[dates.at(-1)] : null;
}
const fmt = sets => sets.filter(x => x && x[1]).map(x => (x[0] ? x[0] + ' kg × ' : '') + x[1]).join(', ');
const nbSeries = e => semaine().s === 8 ? Math.ceil(e.s / 2) : e.s;
const duJour = cle => (D.log[cle] || {})[AUJ] || [];
const exFini = (sess, e) => { const j = duJour(sess + '.' + e.id); return [...Array(nbSeries(e)).keys()].every(i => j[i] && j[i][2]); };

let SESS = 'A';
function majAvance() {
  const bar = document.getElementById('avance');
  if (SESS === 'P') return bar.hidden = true;
  const l = P[SESS], f = l.filter(e => exFini(SESS, e)).length;
  bar.hidden = false; bar.firstChild.style.width = (100 * f / l.length) + '%';
  bar.title = `${f} exercices sur ${l.length} terminés`;
}

function bloc(sess, e) {
  const cle = sess + '.' + e.id, { s } = semaine(), nb = nbSeries(e);
  const prec = derniere(cle), auj = duJour(cle);
  const sec = document.createElement('section');
  sec.className = 'ex' + (exFini(sess, e) ? ' fini' : '');
  const details = [e.note, e.repos && 'repos ' + REPOS[e.repos], s >= 5 && s <= 7 && e.petit && "dernière série à l'échec"].filter(Boolean).join(', ');
  let h = `<div class="tete"><h2>${e.n}</h2><span class="cible">${nb} × ${e.lo}-${e.hi}</span></div>`;
  if (details) h += `<p class="info">${details}</p>`;
  if (prec) {
    h += `<p class="info">Dernière fois : ${fmt(prec)}</p>`;
    if (prec.length >= e.s && prec.slice(0, e.s).every(x => x && +x[1] >= e.hi))
      h += `<p class="astuce">Haut de la fourchette atteint partout : ajoute ${e.leg ? '5' : '2,5'} kg.</p>`;
  }
  h += '<div class="series">';
  for (let i = 0; i < nb; i++) {
    const [kg, r, ok] = auj[i] || [], [pkg, pr] = (prec || [])[i] || [];
    h += `<div class="serie${ok ? ' faite' : ''}" data-i="${i}"><span class="num">${i + 1}</span>
      <input inputmode="decimal" aria-label="${e.n}, série ${i + 1}, kg" placeholder="${pkg || 'kg'}" value="${kg || ''}" data-k="0">
      <span class="x">×</span>
      <input inputmode="numeric" aria-label="${e.n}, série ${i + 1}, reps" placeholder="${pr || 'reps'}" value="${r || ''}" data-k="1">
      <button class="ok" aria-label="Série ${i + 1} faite" aria-pressed="${!!ok}">✓</button></div>`;
  }
  sec.innerHTML = h + '</div>';

  const serie = i => { const j = ((D.log[cle] ||= {})[AUJ] ||= []); for (let k = 0; k <= i; k++) j[k] ||= ['', '', 0]; return j[i]; };
  sec.addEventListener('input', ev => {
    const t = ev.target, row = t.closest('.serie'); if (!row) return;
    serie(+row.dataset.i)[t.dataset.k] = t.value.replace(',', '.'); sauver();
  });
  sec.addEventListener('click', ev => {
    const b = ev.target.closest('.ok'); if (!b) return;
    const row = b.closest('.serie'), i = +row.dataset.i, x = serie(i);
    const [ikg, ir] = row.querySelectorAll('input');
    if (!x[2]) { // valider : reprendre la dernière fois si la case est vide
      if (!ir.value && ir.placeholder !== 'reps') ir.value = ir.placeholder;
      if (!ikg.value && ikg.placeholder !== 'kg') ikg.value = ikg.placeholder;
      if (!ir.value) return ir.focus();
      x[0] = ikg.value.replace(',', '.'); x[1] = ir.value;
    }
    x[2] = x[2] ? 0 : 1; sauver();
    row.classList.toggle('faite', !!x[2]); b.setAttribute('aria-pressed', !!x[2]);
    sec.classList.toggle('fini', exFini(sess, e)); majAvance();
    if (x[2] && e.repos) lancer(e.repos);
  });
  return sec;
}

function afficher(sess) {
  SESS = sess;
  document.querySelectorAll('.onglets button').forEach(b => b.setAttribute('aria-selected', b.dataset.s === sess));
  const { cycle, s } = semaine();
  document.getElementById('semaine').textContent = `Cycle ${cycle}, semaine ${s}/8 : ${REGLE(s)}`;
  const app = document.getElementById('app');
  majAvance();
  if (sess === 'P') return programme(app);
  app.innerHTML = '';
  const l = P[sess];
  for (let i = 0; i < l.length; i++) {
    const e = l[i];
    if (e.ss && l[i + 1] && l[i + 1].ss === e.ss) {
      const g = document.createElement('div'); g.className = 'groupe';
      g.innerHTML = '<p>Superset : enchaîne les deux, puis repos</p>';
      g.append(bloc(sess, e), bloc(sess, l[i + 1])); app.append(g); i++;
    } else app.append(bloc(sess, e));
  }
}

function programme(app) {
  app.innerHTML = `<div class="prog">
  <h2>Organisation</h2>
  <p>Lundi A, mercredi B, vendredi C. Un jour de repos entre deux séances.<br>Échauffement : 5 min de cardio, puis 2 séries légères sur le premier exercice.</p>
  <h2>Plan sur 8 semaines</h2>
  <ul><li>Semaines 1-2 : arrête-toi à 2 reps de l'échec.</li>
  <li>Semaines 3-4 : arrête-toi à 1 rep de l'échec.</li>
  <li>Semaines 5-7 : 1 rep avant l'échec, mais échec sur la dernière série des petits exercices (élévations, curls, triceps, mollets, leg extension).</li>
  <li>Semaine 8 : moitié moins de séries, mêmes charges.</li>
  <li>Ensuite, nouveau cycle avec les charges gagnées.</li></ul>
  <h2>Règles</h2>
  <ol><li>Quand toutes les séries sont en haut de la fourchette : +2,5 kg sur le haut du corps, +5 kg sur les jambes.</li>
  <li>Descends en 2-3 secondes et va bien en bas du mouvement.</li>
  <li>Note chaque série. Le bouton ✓ reprend les chiffres de la dernière fois si tu n'as rien tapé.</li>
  <li>Mêmes exercices et mêmes machines pendant les 8 semaines.</li></ol>
  <h2>Réglages</h2>
  <p><label>Début du cycle 1 (un lundi)<input type="date" id="debut" value="${D.debut}"></label></p>
  <p>Les données restent sur ce téléphone. Fais une sauvegarde de temps en temps.</p>
  <div class="actions"><button id="export">Sauvegarder mes données</button>
  <label class="bouton">Restaurer une sauvegarde<input type="file" id="import" accept=".json,application/json" hidden></label></div>
  </div>`;
  app.querySelector('#debut').onchange = ev => { D.debut = lundi(ev.target.value); sauver(); afficher('P'); };
  app.querySelector('#export').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(D)], { type: 'application/json' }));
    a.download = `muscu-${AUJ}.json`; a.click();
  };
  app.querySelector('#import').onchange = async ev => {
    try { const x = JSON.parse(await ev.target.files[0].text()); if (!x.log) throw 0;
      localStorage.setItem(CLE, JSON.stringify(x)); location.reload();
    } catch { alert("Ce fichier n'est pas une sauvegarde Muscu."); }
  };
}

// Minuteur de repos (basé sur l'heure de fin, juste même si l'écran s'est éteint)
let fin = 0, tic;
function lancer(sec) {
  fin = Date.now() + sec * 1000; clearInterval(tic);
  const o = document.getElementById('chrono'); o.classList.remove('fini');
  const maj = () => {
    const r = Math.max(0, Math.round((fin - Date.now()) / 1000));
    o.textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0');
    if (!r) { clearInterval(tic); o.classList.add('fini'); navigator.vibrate?.([300, 150, 300]); }
  };
  maj(); tic = setInterval(maj, 250);
}
document.getElementById('minuteur').addEventListener('click', ev => { const t = ev.target.closest('[data-t]'); if (t) lancer(+t.dataset.t); });
document.querySelectorAll('.onglets button').forEach(b => b.onclick = () => { afficher(b.dataset.s); scrollTo(0, 0); });

afficher({ 1: 'A', 3: 'B', 5: 'C' }[new Date().getDay()] || 'A');
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // dès qu'une nouvelle version prend la main, la page se recharge toute seule
  const avait = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (avait) location.reload(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update());
}
</script>
</body>
</html>
