<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-haltere-180.png">
<title>Muscu</title>
<style>
  :root { --bg:#0e1110; --s1:#171c19; --s2:#232a25; --ligne:#2e3730; --txt:#f2f5f2; --gris:#9aa59c; --clair:#d5ddd7;
          --vert:#5ccf78; --vertf:#13301c; --fonce:#06210f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif; }
  body { min-height:100vh; -webkit-user-select:none; user-select:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline:2px solid var(--vert); outline-offset:2px; }
  .page { padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 130px); max-width:520px; margin:0 auto; }

  .date { color:var(--gris); font-size:15px; margin:6px 0 14px; }
  .hero { background:var(--s1); border-radius:22px; padding:20px; }
  .sur { color:var(--vert); font-size:14px; font-weight:600; margin:0; }
  h1 { font-size:30px; line-height:1.15; margin:4px 0 4px; letter-spacing:-.01em; }
  .sous { color:var(--gris); margin:0 0 14px; font-size:15px; }
  .apercu { list-style:none; padding:0; margin:0 0 18px; font-size:15px; line-height:1.75; color:var(--clair); }
  .principal { display:block; width:100%; background:var(--vert); color:var(--fonce); font-weight:700; font-size:18px; padding:17px; border-radius:16px; text-align:center; }
  .principal:active, .ligne:active, .stepper button:active, .onglet:active { transform:scale(.97); }
  .secondaire { display:block; width:100%; background:var(--s2); font-weight:600; font-size:16px; padding:15px; border-radius:16px; text-align:center; }
  .mini { color:var(--vert); font-size:15px; padding:10px 0; }

  .carte { margin-top:12px; background:var(--s1); border-radius:18px; padding:14px 16px; }
  .carte b { font-size:16px; }
  .carte p { margin:4px 0 0; color:var(--clair); font-size:15px; }
  .pastilles { display:flex; gap:5px; margin-top:12px; }
  .pastilles i { flex:1; height:6px; border-radius:3px; background:var(--s2); }
  .pastilles i.on { background:var(--vert); }
  .jours { display:flex; justify-content:space-between; margin-top:12px; }
  .jours span { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:600; background:var(--s2); color:var(--gris); }
  .jours span.ok { background:var(--vert); color:var(--fonce); }
  .jours span.auj { box-shadow:0 0 0 2px var(--vert); }
  .alerte { display:block; width:100%; text-align:left; margin-top:12px; background:var(--vertf); color:#c4f1d0; border-radius:14px; padding:12px 14px; font-size:15px; }

  h2 { font-size:15px; margin:26px 4px 8px; color:var(--gris); font-weight:600; }
  .ligne { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--s1); border-radius:16px; padding:14px; margin-bottom:8px; }
  .ligne .txt { flex:1; min-width:0; }
  .ligne b { display:block; font-size:16px; font-weight:600; }
  .ligne small { display:block; color:var(--gris); font-size:13px; margin-top:3px; }
  .chev { color:var(--gris); font-size:24px; line-height:1; }
  .rond { width:36px; height:36px; border-radius:50%; background:var(--s2); display:grid; place-items:center; font-weight:700; font-size:15px; flex:none; color:var(--clair); }
  .rond.ok { background:var(--vert); color:var(--fonce); }
  .paire { border:1px solid var(--ligne); border-radius:20px; padding:10px 8px 0; margin-bottom:8px; }
  .paire > p { margin:0 8px 8px; font-size:13px; color:var(--vert); font-weight:600; }
  .lien { display:block; margin:18px auto 0; color:var(--vert); font-size:16px; padding:10px; }
  .vide { color:var(--gris); font-size:15px; background:var(--s1); border-radius:16px; padding:18px; line-height:1.45; }

  .haut { display:flex; align-items:center; justify-content:space-between; min-height:44px; margin-bottom:6px; }
  .retour { font-size:17px; color:var(--vert); padding:8px 8px 8px 0; }
  .compteur { color:var(--gris); font-size:14px; }
  .prog { height:6px; background:var(--s2); border-radius:3px; overflow:hidden; margin:10px 0 18px; }
  .prog i { display:block; height:100%; background:var(--vert); border-radius:3px; }

  .tag { display:inline-block; background:var(--vertf); color:var(--vert); font-size:13px; font-weight:600; padding:5px 11px; border-radius:20px; margin:4px 0 8px; }
  .cible { color:var(--clair); font-size:16px; margin:0; }
  .regle { color:var(--gris); font-size:14px; margin:4px 0 16px; }
  .puces { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .puce { min-width:66px; padding:9px 10px; border-radius:12px; background:var(--s1); color:var(--gris); font-size:14px; font-weight:600; text-align:center; border:2px solid transparent; }
  .puce.ok { background:var(--vertf); color:var(--vert); }
  .puce.ici { border-color:var(--vert); color:var(--txt); }
  .info { background:var(--s1); border-radius:14px; padding:12px 14px; font-size:15px; margin-bottom:8px; color:var(--clair); line-height:1.4; }
  .info span { color:var(--gris); }
  .info.conseil { background:var(--vertf); color:#c4f1d0; }

  .reglage { background:var(--s1); border-radius:20px; padding:12px 14px 14px; margin-top:10px; }
  .reglage .lab { font-size:14px; color:var(--gris); }
  .stepper { display:flex; align-items:center; gap:10px; margin-top:6px; }
  .stepper button { width:64px; height:64px; border-radius:18px; background:var(--s2); font-size:32px; line-height:1; flex:none; transition:transform .08s; }
  .stepper input { flex:1; min-width:0; background:none; border:0; color:var(--txt); font:inherit; font-size:46px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; padding:4px 0; border-radius:12px; -webkit-user-select:text; user-select:text; }
  .stepper input:focus { background:var(--s2); outline:none; }
  .stepper input::placeholder { color:var(--ligne); }
  .disques { margin:8px 0 0; text-align:center; color:var(--gris); font-size:14px; }
  .disques b { color:var(--clair); }

  details { background:var(--s1); border-radius:16px; margin-top:10px; }
  summary { list-style:none; padding:14px 16px; font-weight:600; font-size:16px; display:flex; justify-content:space-between; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  summary::after { content:"›"; color:var(--gris); transform:rotate(90deg); }
  details[open] summary::after { transform:rotate(-90deg); }
  details ul { margin:0; padding:0 16px 14px 34px; color:var(--clair); font-size:15px; line-height:1.5; }
  .note { display:block; width:100%; margin-top:10px; background:var(--s1); border:1px solid var(--ligne); border-radius:16px; color:var(--txt); font:inherit; font-size:15px; padding:14px 16px; -webkit-user-select:text; user-select:text; }
  .note::placeholder { color:var(--gris); }
  .actions-exo { display:flex; justify-content:space-between; margin-top:4px; }
  .retirer { color:var(--gris); font-size:15px; padding:10px 0; }
  details.alts { margin:0 0 14px; }
  details.alts summary { color:var(--vert); }
  .choix { padding:0 8px 8px; }
  .choix .ligne { background:var(--s2); }
  .choix .aide { color:var(--gris); font-size:13px; margin:4px 6px 4px; line-height:1.4; }

  .tuiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 6px; }
  .tuile { background:var(--s1); border-radius:16px; padding:12px; }
  .tuile b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .tuile span { color:var(--gris); font-size:13px; }
  .rec { color:var(--vert); font-weight:600; }

  .graph { background:var(--s1); border-radius:18px; padding:14px 10px 8px; margin-top:12px; }
  .graph .titre { margin:0 6px 2px; font-weight:600; font-size:15px; }
  .graph .lecture { margin:0 6px 6px; color:var(--gris); font-size:14px; min-height:20px; }
  .graph svg { display:block; width:100%; height:auto; touch-action:pan-y; }
  .saisie { display:flex; gap:8px; margin-top:10px; }
  .saisie input { flex:1; min-width:0; background:var(--s2); border:0; border-radius:12px; color:var(--txt); font:inherit; font-size:18px; padding:12px; -webkit-user-select:text; user-select:text; }
  .saisie button { background:var(--vert); color:var(--fonce); font-weight:700; border-radius:12px; padding:0 16px; }

  .bas { position:fixed; left:0; right:0; bottom:0; padding:28px 16px calc(env(safe-area-inset-bottom) + 14px); background:linear-gradient(rgba(14,17,16,0), var(--bg) 40%); }
  .bas > * { max-width:488px; margin:0 auto; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:5; background:rgba(20,24,21,.97); border-top:1px solid var(--ligne); display:flex; justify-content:center; padding:6px 6px calc(env(safe-area-inset-bottom) + 6px); }
  nav[hidden] { display:none; }
  .onglet { flex:1; max-width:130px; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--gris); font-size:12px; font-weight:600; }
  .onglet svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .onglet[aria-current="page"] { color:var(--vert); }
  .onglet[hidden] { display:none; }
  .sem-t { display:flex; justify-content:space-between; margin:18px 4px 8px; color:var(--gris); font-size:14px; font-weight:600; }
  .sem-t.ici { color:var(--vert); }

  #repos { position:fixed; inset:0; z-index:10; background:rgba(11,14,12,.98); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; }
  #repos[hidden] { display:none; }
  #repos .titre { color:var(--gris); font-size:16px; margin:0; }
  .cercle { position:relative; width:250px; height:250px; }
  .cercle svg { transform:rotate(-90deg); }
  .cercle output { position:absolute; inset:0; display:grid; place-items:center; font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; }
  .suivant { color:var(--gris); text-align:center; font-size:15px; margin:0; }
  .suivant b { display:block; color:var(--txt); font-size:19px; margin-top:4px; }
  .ctrl { display:flex; gap:10px; width:100%; max-width:360px; }
  .ctrl button { flex:1; background:var(--s1); padding:16px 0; border-radius:16px; font-size:16px; font-weight:600; }
  .ctrl .passer { background:var(--vert); color:var(--fonce); flex:1.4; }

  .texte p, .texte li { font-size:15px; line-height:1.5; color:var(--clair); }
  .texte ul, .texte ol { padding-left:20px; }
  .texte h2 { color:var(--txt); font-size:17px; margin:22px 0 6px; }
  .texte input[type=date] { display:block; margin-top:8px; background:var(--s1); color:var(--txt); border:1px solid var(--ligne); border-radius:12px; padding:12px; font:inherit; font-size:16px; width:100%; }
  .actions { display:grid; gap:8px; margin-top:10px; }
  label.secondaire { cursor:pointer; }
</style>
</head>
<body>
<main id="app"></main>

<nav id="nav" aria-label="Navigation">
  <button class="onglet" data-a="onglet" data-v="accueil"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Séance</button>
  <button class="onglet" data-a="onglet" data-v="histo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
  <button class="onglet" data-a="onglet" data-v="progres"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Progrès</button>
  <button class="onglet" data-a="onglet" data-v="course" id="ongCourse" hidden><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></svg>Course</button>
  <button class="onglet" data-a="onglet" data-v="plan"><svg viewBox="0 0 24 24"><path d="M7 3h10v18H7zM10 8h4M10 12h4M10 16h2"/></svg>Plan</button>
</nav>

<div id="repos" hidden role="dialog" aria-label="Repos">
  <p class="titre">Repos</p>
  <div class="cercle">
    <svg width="250" height="250" viewBox="0 0 250 250" aria-hidden="true">
      <circle cx="125" cy="125" r="112" fill="none" stroke="#232a25" stroke-width="14"/>
      <circle id="arc" cx="125" cy="125" r="112" fill="none" stroke="#5ccf78" stroke-width="14" stroke-linecap="round"/>
    </svg>
    <output id="chrono">0:00</output>
  </div>
  <p class="suivant" id="suivant"></p>
  <div class="ctrl">
    <button data-r="-15">−15 s</button><button data-r="15">+15 s</button><button class="passer" data-r="0">Passer</button>
  </div>
</div>

<script src="carnet.js"></script>
<script src="course.js"></script>
<script>
// leg : +5 kg au lieu de +2,5 kg. petit : échec sur la dernière série en semaines 5-7.
// ss : superset (les 2 exercices qui se suivent avec le même numéro). lest : le poids noté est le lest. barre : calcul des disques.
const P = {
  A: [
    { id:'squat', n:'Squat barre', s:3, lo:6, hi:8, repos:180, leg:1, barre:1 },
    { id:'couche', n:'Développé couché barre', s:3, lo:6, hi:8, repos:180, barre:1 },
    { id:'tractions', n:'Tractions', s:4, lo:6, hi:10, repos:120, lest:1 },
    { id:'legcurl', n:'Leg curl assis', s:3, lo:10, hi:12, repos:90, leg:1 },
    { id:'elev', n:'Élévations latérales', s:3, lo:12, hi:20, repos:60, petit:1 },
    { id:'curlinc', n:'Curl incliné', s:3, lo:10, hi:15, ss:1, petit:1 },
    { id:'tri', n:'Extension triceps poulie au-dessus de la tête', s:3, lo:10, hi:15, ss:1, petit:1 },
  ],
  B: [
    { id:'presse', n:'Presse à cuisses', s:3, lo:10, hi:12, repos:120, leg:1 },
    { id:'inclhalt', n:'Développé incliné haltères', s:3, lo:8, hi:12, repos:120 },
    { id:'row', n:'Row machine poitrine appuyée', s:4, lo:8, hi:12, repos:120 },
    { id:'hip', n:'Hip thrust', s:3, lo:8, hi:12, repos:120, leg:1, barre:1 },
    { id:'dips', n:'Dips lestés', s:3, lo:6, hi:10, repos:120, lest:1 },
    { id:'rfly', n:'Reverse fly', s:3, lo:15, hi:20, ss:1 },
    { id:'mollets', n:'Mollets debout', s:3, lo:15, hi:20, ss:1, leg:1, petit:1 },
  ],
  C: [
    { id:'bulgare', n:'Fentes bulgares haltères', s:3, lo:8, hi:12, repos:120, leg:1, note:'par jambe' },
    { id:'chest', n:'Chest press machine', s:3, lo:8, hi:12, repos:120 },
    { id:'tirage', n:'Tirage vertical', s:4, lo:8, hi:12, repos:120 },
    { id:'legext', n:'Leg extension', s:3, lo:12, hi:15, ss:1, leg:1, petit:1 },
    { id:'legcurl', n:'Leg curl assis', s:3, lo:12, hi:15, ss:1, leg:1 },
    { id:'epaules', n:'Développé épaules machine', s:2, lo:8, hi:12, repos:120 },
    { id:'elev', n:'Élévations latérales', s:3, lo:12, hi:15, ss:3, petit:1 },
    { id:'marteau', n:'Curl marteau', s:3, lo:12, hi:15, ss:3, petit:1 },
  ],
};
const TECH = {
  squat:['Pieds largeur d\'épaules, pointes un peu ouvertes.','Genoux dans l\'axe des pieds, dos neutre.','Descends au moins cuisses parallèles, puis pousse le sol.'],
  couche:['Omoplates serrées et basses, pieds ancrés au sol.','Barre vers le bas des pecs, coudes pas trop écartés.','Fesses sur le banc pendant toute la série.'],
  tractions:['Départ bras tendus.','Tire les coudes vers les hanches, poitrine vers la barre.','Menton au-dessus de la barre, descente contrôlée.'],
  legcurl:['Genou aligné avec l\'axe de la machine.','Bassin collé au dossier, cuisse bloquée.','Plie à fond, remonte lentement presque jambe tendue.'],
  elev:['Buste légèrement penché, coudes un peu fléchis.','Monte jusqu\'à hauteur d\'épaules en menant avec les coudes.','Pas d\'élan.'],
  curlinc:['Banc à 45-60°, bras pendants derrière le corps.','Coudes fixes, ne les avance pas en montant.','Descends jusqu\'au bras tendu pour bien étirer.'],
  tri:['Dos à la poulie, corde au-dessus de la tête.','Coudes serrés et fixes.','Descends bien derrière la tête, tends complètement.'],
  presse:['Pieds largeur d\'épaules, au milieu de la plateforme.','Descends sans décoller le bas du dos.','Ne verrouille pas les genoux en haut.'],
  inclhalt:['Banc à environ 30°.','Omoplates serrées, haltères descendus bas sur les côtés.','Pousse vers le haut sans cogner les haltères.'],
  row:['Poitrine collée au support.','Tire les coudes vers l\'arrière, serre les omoplates.','Laisse les épaules s\'avancer à l\'étirement.'],
  hip:['Bas des omoplates sur le banc, barre sur le pli des hanches avec une mousse.','Pieds à plat, tibias verticaux en haut du mouvement.','Serre les fessiers en haut, menton rentré, sans cambrer.'],
  dips:['Buste légèrement penché en avant.','Descends jusqu\'à épaules un peu sous les coudes, sans douleur.','Pousse jusqu\'aux bras tendus.'],
  rfly:['Bras presque tendus.','Ouvre vers l\'arrière en menant avec les coudes.','Épaules basses, pas de haussement.'],
  mollets:['Genoux tendus.','Descends les talons au plus bas, tiens 1 s.','Monte sur la pointe au maximum.'],
  bulgare:['Pied arrière posé sur le banc.','Descends jusqu\'à ce que le genou arrière frôle le sol.','Buste légèrement penché en avant, genou avant dans l\'axe.'],
  chest:['Poignées à hauteur du milieu des pecs.','Omoplates serrées contre le dossier.','Ne verrouille pas les coudes.'],
  tirage:['Prise un peu plus large que les épaules.','Tire la barre vers le haut de la poitrine, coudes vers le bas.','Ne te penche pas trop en arrière.'],
  legext:['Genou aligné avec l\'axe de la machine.','Tends complètement et tiens 1 s.','Descente lente.'],
  epaules:['Dos collé au dossier.','Pousse sans cambrer.','Redescends jusqu\'à hauteur du menton.'],
  marteau:['Prise neutre, pouces vers le haut.','Coudes collés au corps.','Pas de balancier.'],
};
// Alternatives quand la machine est prise : même muscle, même fourchette de reps et même repos que l'exercice prévu.
// Chaque alternative a son propre historique (sauf si c'est un exercice du programme, comme la presse ou le tirage).
const AUTRES = {
  hack:{ n:'Hack squat machine', t:['Pieds au milieu de la plateforme, largeur d\'épaules.','Dos collé au dossier.','Descends au moins cuisses parallèles.'] },
  goblet:{ n:'Goblet squat haltère', t:['Haltère tenu contre la poitrine, coudes vers le bas.','Buste droit, genoux dans l\'axe des pieds.','Descends le plus bas possible sans arrondir le dos.'] },
  couchehalt:{ n:'Développé couché haltères', t:['Omoplates serrées, pieds ancrés au sol.','Descends les haltères sur les côtés des pecs.','Pousse vers le haut sans cogner les haltères.'] },
  couchesmith:{ n:'Développé couché Smith', t:['Banc placé pour que la barre arrive au bas des pecs.','Omoplates serrées, coudes pas trop écartés.','Note le poids de la barre Smith, il change d\'une salle à l\'autre.'] },
  tirageserre:{ n:'Tirage vertical prise serrée', t:['Poignée triangle ou prise serrée.','Tire vers le haut de la poitrine, coudes vers les hanches.','Remonte bras tendus pour bien étirer.'] },
  legcurlallonge:{ n:'Leg curl allongé', t:['Genou juste au bord du banc.','Bassin plaqué, ne décolle pas les hanches.','Plie à fond, redescends lentement.'] },
  rdl:{ n:'Soulevé de terre roumain haltères', t:['Genoux légèrement fléchis et fixes.','Pousse les fesses en arrière, haltères le long des cuisses.','Descends jusqu\'à l\'étirement des ischios, dos neutre.'] },
  elevpoulie:{ n:'Élévations latérales poulie', t:['Poulie basse, câble passé devant le corps.','Monte jusqu\'à hauteur d\'épaules en menant avec le coude.','Descente lente, tension constante.'] },
  elevmachine:{ n:'Élévations latérales machine', t:['Épaules alignées avec l\'axe de la machine.','Monte jusqu\'à hauteur d\'épaules.','Pas d\'élan, descente lente.'] },
  curlhalt:{ n:'Curl haltères debout', t:['Coudes collés au corps.','Tourne le poignet en montant (pouce vers l\'extérieur).','Descends jusqu\'au bras tendu.'] },
  curlpoulie:{ n:'Curl poulie basse', t:['Face à la poulie, coudes fixes.','Monte sans avancer les coudes.','Descente contrôlée jusqu\'au bras tendu.'] },
  trihalt:{ n:'Extension triceps haltère au-dessus de la tête', t:['Haltère tenu à deux mains derrière la tête.','Coudes serrés et pointés vers le haut.','Descends bien derrière la tête, tends complètement.'] },

function graphique(pts, unite) {
  if (!pts.length) return '';
  const W = 340, H = 170, g = 38, dr = 14, ht = 14, bas = 24;
  const ys = pts.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys);
  const pad = (mx - mn) * .15 || Math.max(1, mx * .1), y0 = Math.max(0, mn - pad), y1 = mx + pad;
  const X = i => pts.length === 1 ? (g + W - dr) / 2 : g + i * (W - dr - g) / (pts.length - 1);
  const Y = v => ht + (1 - (v - y0) / (y1 - y0)) * (H - ht - bas);
  const ticks = [y0, (y0 + y1) / 2, y1];
  let s = `<svg viewBox="0 0 ${W} ${H}" data-pts='${JSON.stringify(pts.map((p, i) => [X(i), Y(p.y), p.y, p.label]))}' data-u="${unite}" role="img" aria-label="Évolution en ${unite}">`;
  for (const t of ticks) s += `<line x1="${g}" x2="${W - dr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#2e3730" stroke-width="1"/><text x="${g - 6}" y="${Y(t) + 4}" fill="#9aa59c" font-size="11" text-anchor="end">${kgFr(y1 - y0 < 6 ? Math.round(t * 10) / 10 : Math.round(t))}</text>`;
  s += `<text x="${X(0)}" y="${H - 6}" fill="#9aa59c" font-size="11" text-anchor="${pts.length > 1 ? 'start' : 'middle'}">${pts[0].label}</text>`;
  if (pts.length > 1) s += `<text x="${X(pts.length - 1)}" y="${H - 6}" fill="#9aa59c" font-size="11" text-anchor="end">${pts.at(-1).label}</text>`;
  if (pts.length > 1) s += `<polyline fill="none" stroke="#5ccf78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p, i) => X(i) + ',' + Y(p.y)).join(' ')}"/>`;
  pts.forEach((p, i) => s += `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="#5ccf78" stroke="#171c19" stroke-width="2"/>`);
  const l = pts.length - 1;
  s += `<text x="${X(l)}" y="${Y(pts[l].y) - 10}" fill="#f2f5f2" font-size="12" font-weight="700" text-anchor="${pts.length > 1 ? 'end' : 'middle'}">${kgFr(pts[l].y)}</text>`;
  s += `<line class="viseur" x1="0" x2="0" y1="${ht}" y2="${H - bas}" stroke="#9aa59c" stroke-width="1" visibility="hidden"/><circle class="point" r="6" fill="#5ccf78" stroke="#f2f5f2" stroke-width="2" visibility="hidden"/>`;
  return s + '</svg>';
}
function brancherGraphiques() {

  ({ bienvenue:vBienvenue, accueil:vAccueil, seance:vSeance, exo:vExo, bilan:vBilan, histo:vHisto, progres:vProgres, mouv:vMouv, plan:vPlan, course:vCourse, run:vRun })[etat.v]();
  document.getElementById('ongCourse').hidden = !COURSE;
  NAV.hidden = !RACINES.includes(etat.v) || !PROF.actif || !!ORPHELIN;
  NAV.querySelectorAll('.onglet').forEach(b => b.dataset.v === etat.v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  brancherGraphiques();
  eveil(etat.v === 'exo');
}

// ---------- écrans ----------
function creerProfil(nom) {
  nom = nom.trim().slice(0, 20);
  if (!nom) return "Écris un prénom.";
  if (ORPHELIN) {
    const v = localStorage.getItem(cleDe(ORPHELIN));
    if (v && !localStorage.getItem(cleDe(nom))) localStorage.setItem(cleDe(nom), v);
    localStorage.removeItem(cleDe(ORPHELIN));
    PROF.liste = PROF.liste.filter(x => x !== ORPHELIN && x !== nom).concat(nom); PROF.actif = nom; sauverProfils(); return location.reload();
  }
  if (PROF.liste.includes(nom)) { PROF.actif = nom; sauverProfils(); return location.reload(); }
  const ancien = localStorage.getItem('muscu'); // données d'avant les profils : elles vont au premier profil créé
  if (!PROF.liste.length && ancien) { localStorage.setItem(cleDe(nom), ancien); localStorage.removeItem('muscu'); }
  PROF.liste.push(nom); PROF.actif = nom; sauverProfils(); location.reload();
}
function vBienvenue() {
  app.innerHTML = `<div class="page">
    <p class="date">${dateFr(AUJ)}</p>
    <h1>Qui es-tu ?</h1>
    <p class="sous">Chacun a ses propres séances et courbes.</p>
    <div class="actions">${PRENOMS.map(n => `<button class="principal" data-a="choisir" data-n="${n}">${n}</button>`).join('')}</div>
  </div>`;
}

function vAccueil() {
  const s = prochaine(), { cycle, s: sem } = semaine(), n = nbFaits(s), tot = P[s].length;
  const finie = n === tot && commencee(s);
  const bouton = finie ? `<button class="secondaire" data-a="bilan" data-s="${s}" data-d="${AUJ}">Voir le résumé</button>`
    : `<button class="principal" data-a="ouvrir" data-s="${s}">${commencee(s) ? `Reprendre (${n} sur ${tot})` : 'Commencer'}</button>`;

  const jours = [...Array(7)].map((_, i) => { const d = plusJours(lun, i);
    return `<span class="${faits.has(d) ? 'ok' : ''} ${d === AUJ ? 'auj' : ''}" aria-label="${dateFr(d)}${faits.has(d) ? ', séance faite' : ''}">${'LMMJVSD'[i]}</span>`; }).join('');
  const nbSem = [...faits].filter(d => d >= lun && d <= plusJours(lun, 6)).length;

    <div class="hero">
      <p class="sur">${finie ? 'Terminée aujourd\'hui' : commencee(s) ? 'En cours' : 'Prochaine séance'}</p>
      <h1>Séance ${s}</h1>
      <p class="sous">${tot} exercices, 1 h à 1 h 15</p>
      <ul class="apercu">${L(s).map(e => `<li>${e.n}</li>`).join('')}</ul>
      ${bouton}
    </div>
    ${(x => x ? `<h2>Course à pied</h2><button class="ligne" data-a="run" data-id="${x.id}"><span class="rond">${x.test ? '5k' : x.sem}</span>
      <span class="txt"><b>${x.titre}</b><small>${x.d === AUJ ? 'Aujourd\'hui' : dateFr(x.d)}, environ ${dureeRun(x, allures(dernierTest().s))} min</small></span><span class="chev">›</span></button>` : '')(prochaineCourse())}
    <div class="carte">
      <b>Cette semaine : ${nbSem} séance${nbSem > 1 ? 's' : ''} sur 3</b>
      <div class="jours">${jours}</div>
    </div>
    <div class="carte">
      <b>Cycle ${cycle}, semaine ${sem} sur 8</b>
      <p>${REGLE(sem)}</p>
      <div class="pastilles">${[...Array(8)].map((_, i) => `<i class="${i < sem ? 'on' : ''}"></i>`).join('')}</div>
    </div>
    ${aSauver ? '<button class="alerte" data-a="onglet" data-v="plan">Pense à sauvegarder tes données (onglet Plan). Elles ne sont que sur ce téléphone.</button>' : ''}
    <h2>Autres séances</h2>
    ${ORDRE.filter(x => x !== s).map(x => { const d = derniereDate(x); return `
      <button class="ligne" data-a="ouvrir" data-s="${x}"><span class="rond">${x}</span>
        <span class="txt"><b>Séance ${x}</b><small>${d ? 'Faite le ' + dateFr(d, { weekday:'long', day:'numeric', month:'short' }) : 'Pas encore faite'}</small></span>
        <span class="chev">›</span></button>`; }).join('')}
  </div>`;
}

function vSeance() {
  const s = etat.s, l = L(s), n = nbFaits(s);
  let liste = '';
  const ligne = i => { const e = l[i], prec = derniere(s, e), ok = exFini(s, i);
    const fait = duJour(s, e).filter(x => x && x[2]).length;
    const sous = (e.orig ? `À la place de ${e.orig.n.toLowerCase()}, ` : '') + `${nbSeries(e)} × ${e.lo}-${e.hi}` + (fait && !ok ? `, ${fait} faite${fait > 1 ? 's' : ''}` : prec ? `, dernière fois ${resume(prec.slice(0, 1))}` : '');
    return `<button class="ligne" data-a="exo" data-i="${i}"><span class="rond ${ok ? 'ok' : ''}">${ok ? '✓' : i + 1}</span>
      <span class="txt"><b>${e.n}</b><small>${sous}</small></span><span class="chev">›</span></button>`; };
  for (let i = 0; i < l.length; i++) {
    if (l[i].ss && l[i + 1] && l[i + 1].ss === l[i].ss) { liste += `<div class="paire"><p>Superset : enchaîne les deux</p>${ligne(i)}${ligne(i + 1)}</div>`; i++; }
    else liste += ligne(i);
  }
  const fini = n === l.length;
  app.innerHTML = `<div class="page">
    <div class="haut"><button class="retour" data-a="retour">‹ Retour</button><span class="compteur">${n} sur ${l.length} exercices</span></div>
    <h1>Séance ${s}</h1>
    <div class="prog"><i style="width:${100 * n / l.length}%"></i></div>
    <div class="info"><span>Échauffement :</span> 5 min de cardio, puis 2 séries légères sur le premier exercice.</div>
    ${liste}
  </div>
  <div class="bas">${fini ? `<button class="secondaire" data-a="bilan" data-s="${s}" data-d="${AUJ}">Voir le résumé</button>`
    : `<button class="principal" data-a="continuer">${commencee(s) ? 'Continuer' : 'Commencer la séance'}</button>`}</div>`;
}

function valeursDepart(s, st) {
  const e = L(s)[st.i], auj = duJour(s, e), prec = derniere(s, e);
  if (auj[st.k] && auj[st.k][1]) return { kg: auj[st.k][0], r: auj[st.k][1] };
  const avant = auj[st.k - 1];
  if (avant && avant[1]) return { kg: avant[0], r: avant[1] };
  const monte = tropFacile(e, prec), inc = e.leg ? 5 : 2.5, p = prec && (prec[st.k] || prec.at(-1));
  if (p) return { kg: monte ? String(num(p[0]) + inc) : p[0], r: monte ? e.lo : p[1] };
  return { kg: '', r: e.lo };
}
function texteDisques(kg) {
  const r = disques(kg); if (!r) return `Moins que la barre seule (${BARRE} kg)`;
  if (!r.out.length) return `Barre seule (${BARRE} kg)`;
  return `Par côté : <b>${r.out.map(kgFr).join(' + ')}</b>${r.reste ? ` (il manque ${kgFr(r.reste * 2)} kg)` : ''}`;
}

function vExo() {
  const s = etat.s, E = etapes(s), st = E[etat.pos], e = L(s)[st.i], nb = nbSeries(e);
  const auj = duJour(s, e), prec = derniere(s, e), sem = semaine().s, v = valeursDepart(s, st), pa = partenaire(s, st.i);
  const etapesEx = E.map((x, j) => ({ ...x, j })).filter(x => x.i === st.i);
  const puces = etapesEx.map(x => { const z = auj[x.k];
    const ok = z && z[2], txt = ok ? (num(z[0]) ? kgFr(num(z[0])) + '×' : '') + z[1] : 'Série ' + (x.k + 1);
    return `<button class="puce ${ok ? 'ok' : ''} ${x.j === etat.pos ? 'ici' : ''}" data-a="aller" data-j="${x.j}">${txt}</button>`; }).join('');
  const m = D.seances[AUJ + '|' + s];
  let infos = '';
  if (st.i === 0 && st.k === 0 && !auj.some(x => x && x[2]) && num(v.kg) >= 20)
    infos += `<div class="info"><span>Échauffement :</span> 8 reps à ${kgFr(arrondi(num(v.kg) * .5))} kg, puis 4 reps à ${kgFr(arrondi(num(v.kg) * .75))} kg.</div>`;
  if (prec) infos += `<div class="info"><span>Dernière fois :</span> ${resume(prec)}</div>`;
  if (tropFacile(e, prec) && !auj.some(x => x && x[2])) infos += `<div class="info conseil">Tu as fait le haut de la fourchette partout : ajoute ${e.leg ? '5' : '2,5'} kg aujourd'hui. C'est déjà prérempli.</div>`;
  if (sem >= 5 && sem <= 7 && e.petit && st.k === nb - 1) infos += `<div class="info conseil">Dernière série : va jusqu'à l'échec.</div>`;
  const tag = pa ? `<span class="tag">Superset avec ${pa.n.toLowerCase()}${st.repos ? '' : ', enchaîne sans repos'}</span>` : '';
  const reposTxt = e.repos ? `, repos ${REPOS_TXT[e.repos]}` : '';
  const dejaFaite = auj[st.k] && auj[st.k][2];
  // machine prise : exercices équivalents (et retour à l'exercice prévu si on est déjà sur une alternative)
  const prevu = e.orig || e, pris = new Set(L(s).map(x => x.id)); // pas deux fois le même exercice dans la séance
  const choix = [...(e.orig ? [prevu.id] : []), ...(ALT[prevu.id] || []).filter(id => !pris.has(id))].map(id => {
    const f = FICHE(id), h = histoMouvement(id).filter(x => x.d < AUJ);
    return `<button class="ligne" data-a="alt" data-id="${id}"><span class="txt"><b>${id === prevu.id ? 'Revenir à ' + f.n.toLowerCase() : f.n}</b>
      <small>${id === prevu.id ? 'L\'exercice prévu' : h.length ? 'Dernière fois ' + resume(h.at(-1).sets.slice(0, 1)) : 'Pas encore fait'}</small></span><span class="chev">›</span></button>`; }).join('');
  const blocAlt = choix ? `<details class="alts"><summary>${e.orig ? 'À la place de ' + prevu.n.toLowerCase() + ', changer' : 'Machine prise ? Alternatives'}</summary>
    <div class="choix">${choix}<p class="aide">Même nombre de séries, mêmes reps, même repos. Le suivi se fait sur l'exercice choisi, pour aujourd'hui seulement.</p></div></details>` : '';
  app.innerHTML = `<div class="page">
    <div class="haut"><button class="retour" data-a="retour">‹ Séance ${s}</button><span class="compteur">Exercice ${st.i + 1} sur ${P[s].length}${m ? ', ' + duree(Date.now() - m.t0) : ''}</span></div>
    ${tag}
    <h1>${e.n}</h1>
    <p class="cible">Série ${st.k + 1} sur ${nb}, objectif ${e.lo}-${e.hi} reps${e.note ? ' ' + e.note : ''}${reposTxt}</p>
    <p class="regle">${REGLE(sem)}</p>
    ${blocAlt}
    <div class="puces">${puces}</div>
    ${infos}
    <div class="reglage"><span class="lab">${e.lest ? 'Lest (kg)' : 'Poids (kg)'}</span>
      <div class="stepper"><button data-a="pas" data-c="kg" data-d="-2.5" aria-label="Moins 2,5 kg">−</button>
      <input id="kg" inputmode="decimal" value="${v.kg === '' ? '' : kgFr(num(v.kg))}" placeholder="0" aria-label="Poids en kg">
      <button data-a="pas" data-c="kg" data-d="2.5" aria-label="Plus 2,5 kg">+</button></div>
      ${e.barre ? `<p class="disques" id="disques">${texteDisques(num(v.kg))}</p>` : ''}</div>
    <div class="reglage"><span class="lab">Répétitions</span>
      <div class="stepper"><button data-a="pas" data-c="r" data-d="-1" aria-label="Une rep de moins">−</button>
      <input id="r" inputmode="numeric" value="${v.r}" aria-label="Répétitions">
      <button data-a="pas" data-c="r" data-d="1" aria-label="Une rep de plus">+</button></div></div>
    <div class="actions-exo">
      ${dejaFaite ? '<button class="retirer" data-a="retirer">Retirer cette série</button>' : '<span></span>'}
      <button class="mini" data-a="mouv" data-id="${e.id}">Ma progression ›</button>
    </div>
    <details><summary>Technique</summary><ul>${(TECH[e.id] || []).map(t => `<li>${t}</li>`).join('')}</ul></details>
    <input class="note" id="note" value="${(D.notes[e.id] || '').replace(/"/g, '&quot;')}" placeholder="Note : réglage du siège, prise, machine…" aria-label="Note sur cet exercice">
  </div>
  <div class="bas"><button class="principal" data-a="valider">${dejaFaite ? 'Modifier' : 'Valider'} la série ${st.k + 1}</button></div>`;
  app.querySelector('#note').oninput = ev => { D.notes[e.id] = ev.target.value; sauver(); };
  if (e.barre) app.querySelector('#kg').oninput = ev => app.querySelector('#disques').innerHTML = texteDisques(num(ev.target.value));
}

function vBilan() {
  const { s, d } = etat, st = statsSeance(s, d);
  const lignes = L(s, d).map(e => {
    const sets = faitsDu(s, e, d);
    if (!sets.length) return '';
    const avant = histoMouvement(e.id).filter(x => x.d < d).flatMap(x => x.sets.map(y => num(y[0])));
    const record = avant.length && Math.max(...sets.map(x => num(x[0]))) > Math.max(...avant);
    return `<button class="ligne" data-a="mouv" data-id="${e.id}"><span class="rond ok">✓</span><span class="txt"><b>${e.n}</b>
      <small>${resume(sets)}${record ? ' <span class="rec">record de charge</span>' : ''}</small></span><span class="chev">›</span></button>`;
  }).join('');
  const fin = d === AUJ && nbFaits(s) === P[s].length;
  app.innerHTML = `<div class="page">
    <div class="haut"><button class="retour" data-a="retour">‹ Retour</button><span></span></div>
    <p class="sur">${dateFr(d)}</p>
    <h1>Séance ${s}${fin ? ' terminée' : ''}</h1>
    <div class="tuiles">
      <div class="tuile"><b>${st.duree || '–'}</b><span>durée</span></div>
      <div class="tuile"><b>${st.series}</b><span>séries</span></div>
      <div class="tuile"><b>${milliers(st.volume)}</b><span>kg soulevés</span></div>
    </div>
    ${fin ? `<p class="sous">Prochaine séance : ${ORDRE[(ORDRE.indexOf(s) + 1) % 3]}.</p>` : ''}
    ${lignes || '<p class="vide">Aucune série validée ce jour-là.</p>'}
  </div>
  ${fin ? '<div class="bas"><button class="principal" data-a="onglet" data-v="accueil">Retour à l\'accueil</button></div>' : ''}`;
}

  const l = seancesFaites();
  app.innerHTML = `<div class="page">
    <h1>Historique</h1>
    <p class="sous">${l.length} séance${l.length > 1 ? 's' : ''} enregistrée${l.length > 1 ? 's' : ''}</p>
    ${l.length ? l.map(x => { const st = statsSeance(x.s, x.d);
      return `<button class="ligne" data-a="bilan" data-s="${x.s}" data-d="${x.d}"><span class="rond">${x.s}</span>
        <span class="txt"><b>${dateFr(x.d)}</b><small>${[st.duree, st.ex + ' exercices', milliers(st.volume) + ' kg soulevés'].filter(Boolean).join(', ')}</small></span>
        <span class="chev">›</span></button>`; }).join('')
      : '<p class="vide">Tes séances apparaîtront ici dès ta première série validée.</p>'}
  </div>`;
}

function vProgres() {
  const poids = Object.keys(D.poids).sort().map(d => ({ y: D.poids[d], label: dateCourte(d) }));
  const lignes = MOUVEMENTS.map(e => {
    const h = histoMouvement(e.id); if (!h.length) return '';
    const maxs = h.map(x => Math.max(...x.sets.map(y => num(y[0]))));
    const delta = maxs.at(-1) - maxs[0];
    const sous = maxs.at(-1) ? `max ${kgFr(maxs.at(-1))} kg` + (h.length > 1 && delta ? `, ${delta > 0 ? '+' : ''}${kgFr(delta)} kg depuis le ${dateCourte(h[0].d)}` : '') : `${h.length} séance${h.length > 1 ? 's' : ''}`;
    return `<button class="ligne" data-a="mouv" data-id="${e.id}"><span class="txt"><b>${e.n}</b><small>${sous}</small></span><span class="chev">›</span></button>`;
  }).join('');
  app.innerHTML = `<div class="page">
    <div class="haut"><h1 style="margin:0">Progrès</h1><button class="mini" data-a="partager">Partager</button></div>
    <div class="graph">
      <p class="titre">Poids du corps (kg)</p>
      <p class="lecture">${poids.length ? 'Dernier : ' + kgFr(poids.at(-1).y) + ' kg. Touche la courbe pour lire une date.' : 'Note ton poids de temps en temps, le matin à jeun.'}</p>
      ${graphique(poids, 'kg')}
      <div class="saisie"><input id="pc" inputmode="decimal" placeholder="Poids d'aujourd'hui" value="${D.poids[AUJ] ? kgFr(D.poids[AUJ]) : ''}" aria-label="Poids du corps en kg">
      <button data-a="poids">Enregistrer</button></div>
    </div>
    <h2>Par exercice</h2>
    ${lignes || '<p class="vide">Tes courbes apparaîtront après ta première séance.</p>'}
  </div>`;
}

function vMouv() {
  const e = MOUVEMENTS.find(x => x.id === etat.id), h = histoMouvement(e.id);
  const avecKg = h.some(x => x.sets.some(y => num(y[0])));
  const pts = h.map(x => ({ y: avecKg ? Math.max(...x.sets.map(y => num(y[0]))) : Math.max(...x.sets.map(y => num(y[1]))), label: dateCourte(x.d) }));
  let rec = '';
  if (h.length) {
    const tous = h.flatMap(x => x.sets.map(y => ({ ...y, d: x.d })));
    const lourd = tous.reduce((a, b) => num(b[0]) > num(a[0]) || (num(b[0]) === num(a[0]) && num(b[1]) > num(a[1])) ? b : a);
    const fort = tous.reduce((a, b) => e1rm(b) > e1rm(a) ? b : a);
    rec = `<div class="tuiles">
      <div class="tuile"><b>${avecKg ? kgFr(num(lourd[0])) : lourd[1]}</b><span>${avecKg ? 'kg max' : 'reps max'}</span></div>
      <div class="tuile"><b>${avecKg ? '≈ ' + Math.round(e1rm(fort)) : '–'}</b><span>1RM estimé</span></div>
      <div class="tuile"><b>${h.length}</b><span>séances</span></div></div>`;
  }
  app.innerHTML = `<div class="page">
    <div class="haut"><button class="retour" data-a="retour">‹ Retour</button><span></span></div>
    <h1>${e.n}</h1>
    ${rec}
    ${h.length ? `<div class="graph"><p class="titre">${avecKg ? 'Charge max par séance (kg)' : 'Reps max par séance'}</p>
      <p class="lecture">Touche la courbe pour lire une séance.</p>${graphique(pts, avecKg ? 'kg' : 'reps')}</div>
      <h2>Détail</h2>
      ${h.slice().reverse().map(x => `<div class="ligne"><span class="txt"><b>${dateFr(x.d)}</b><small>${resume(x.sets)}${carnet.has(x.d) ? ', carnet' : ''}</small></span></div>`).join('')}`
    : '<p class="vide">Pas encore de série sur cet exercice.</p>'}
    <details><summary>Technique</summary><ul>${(TECH[e.id] || []).map(t => `<li>${t}</li>`).join('')}</ul></details>
  </div>`;
}

    <li>Mêmes exercices et mêmes machines pendant les 8 semaines.</li></ol>
    <h2>Profils sur ce téléphone</h2>
    <p>Si vous partagez un téléphone, touche ton prénom avant de commencer. Chacun garde ses séances, courbes et notes.</p>
    ${PRENOMS.map(n => `<button class="ligne" data-a="profil" data-n="${n}"><span class="rond ${n === PROF.actif ? 'ok' : ''}">${n === PROF.actif ? '✓' : n[0].toUpperCase()}</span>
      <span class="txt"><b>${n}</b><small>${n === PROF.actif ? 'Profil utilisé' : 'Toucher pour passer sur ce profil'}</small></span></button>`).join('')}
    <h2>Réglages</h2>
    <p>Début du cycle 1 (un lundi)<input type="date" id="debut" value="${D.debut}"></p>
    <p>Tes séries restent sur ce téléphone. Fais une sauvegarde de temps en temps${D.export ? ` (dernière le ${dateFr(D.export, { day:'numeric', month:'long' })})` : ''}.</p>
    <div class="actions"><button class="secondaire" id="export">Sauvegarder mes données</button>
    <label class="secondaire">Restaurer une sauvegarde<input type="file" id="import" accept=".json,application/json" hidden></label></div>
  </div>`;
  app.querySelector('#debut').onchange = ev => { D.debut = lundi(ev.target.value); sauver(); rendre(); };
  app.querySelector('#export').onclick = async () => {
    const f = new File([JSON.stringify(D)], `muscu-${PROF.actif.toLowerCase()}-${AUJ}.json`, { type:'application/json' });
    try { if (navigator.canShare?.({ files:[f] })) await navigator.share({ files:[f], title:'Sauvegarde Muscu' });
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); }
      D.export = AUJ; sauver(); rendre();
    } catch {}
  };
  app.querySelector('#import').onchange = async ev => {
    try { const x = JSON.parse(await ev.target.files[0].text()); if (!x.log) throw 0;
      localStorage.setItem(CLE, JSON.stringify(x)); location.reload();
    } catch { alert("Ce fichier n'est pas une sauvegarde Muscu."); }
  };
}

function vCourse() {
  const t = dernierTest(), al = allures(t.s), lun = lundi(AUJ), fin = COURSE.at(-1).d;
  const allur = ['E', 'T', 'I', 'A5'].map(k => `<div class="ligne"><span class="txt"><b>${ALLURE_NOM[k]} : ${mmss(al[k][1])} à ${mmss(al[k][0])} /km</b><small>${ALLURE_AIDE[k]}</small></span></div>`).join('');
  let semaines = '';
  for (let w = 1; w <= COURSE.at(-1).sem; w++) {
    const l = COURSE.filter(x => x.sem === w), ici = lun === plusJours(l[0].d, -1);
    semaines += `<p class="sem-t ${ici ? 'ici' : ''}"><span>Semaine ${w}${ici ? ', cette semaine' : ''}</span><span>${l[0].allegee ? 'allégée' : ''}</span></p>` + l.map(x => { const f = D.course.faits[x.id], te = D.course.tests[x.id];
      return `<button class="ligne" data-a="run" data-id="${x.id}"><span class="rond ${f ? 'ok' : ''}">${f ? '✓' : x.test ? '5k' : x.id.endsWith('m') ? 'Ma' : 'Di'}</span>
        <span class="txt"><b>${x.titre}</b><small>${dateFr(x.d, { weekday:'long', day:'numeric', month:'short' })}${te ? ', ' + mmss(te.s) : ''}</small></span><span class="chev">›</span></button>`; }).join('');
  }
  app.innerHTML = `<div class="page">
    <h1>Course</h1>
    <p class="sous">5 km sous 20 min le ${dateFr(fin, { weekday:'long', day:'numeric', month:'long' })}. 2 sorties par semaine, le mardi et le dimanche.</p>
    <div class="tuiles">
      <div class="tuile"><b>${mmss(t.s)}</b><span>${t.d ? 'dernier 5 km' : '5 km estimé'}</span></div>
      <div class="tuile"><b>${mmss(t.s / 5)}</b><span>allure /km</span></div>
      <div class="tuile"><b>4:00</b><span>objectif /km</span></div>
    </div>
    ${t.d ? '' : '<p class="info">Allures calculées sur environ 24 min. Le test du dimanche 15 novembre les recale sur ton vrai chrono.</p>'}
    ${Math.round(t.s) !== window.COURSE_FIT ? `<p class="info conseil">Ta montre a encore les allures d'un 5 km en ${mmss(window.COURSE_FIT)}. Il faut regénérer les fichiers avec ton chrono de ${mmss(t.s)}.</p>` : ''}
    <h2>Tes allures</h2>${allur}
    <details><summary>Mettre les séances sur la montre</summary><ul>
      <li>Branche la Forerunner 255 à un ordinateur avec son câble.</li>
      <li>Ouvre Forerunner 255, puis le stockage interne, puis GARMIN, puis NewFiles.</li>
      <li>Copie dedans les fichiers .fit du dossier sport\\montre\\fit (une séance par fichier, les 40 d'un coup).</li>
      <li>Débranche. Sur la montre : START, Course à pied, UP, Entraînement, Entraînements, puis la séance du jour (S01 mar, S01 dim…), puis Faire entraînement.</li>
      <li>La montre affiche chaque étape et bipe si tu sors de l'allure.</li></ul></details>
    <details><summary>Règles</summary><ul>
      <li>Le footing doit rester facile : si tu ne peux plus parler, ralentis.</li>
      <li>Muscu lundi, mercredi, vendredi. Si les jambes sont lourdes le mardi après la séance A, décale le fractionné au jeudi.</li>
      <li>Jamais deux jours de course d'affilée. Une séance ratée ne se rattrape pas, on reprend la suivante.</li>
      <li>Un test toutes les 5 semaines : tes allures se recalent sur le nouveau chrono.</li>
      <li>Semaines 5, 10 et 15 allégées : on récupère pour mieux progresser.</li></ul></details>
    ${semaines}
  </div>`;
}

function vRun() {
  const x = COURSE.find(y => y.id === etat.rid), al = allures(dernierTest().s), f = D.course.faits[x.id], te = D.course.tests[x.id];
  const cleP = x.pas.flatMap(p => p.rep ? p.pas : [p]).find(p => ['I', 'A5', 'T'].includes(p.a));
  const but = x.objectif ? 'Le jour J. Pars à 4:00 /km, accélère sur le dernier kilomètre.'
    : x.test ? 'Test : le 5 km le plus rapide possible, à allure régulière. Tes allures se recalent sur ce chrono.'
    : cleP ? BUTS[cleP.a] : 'Footing facile pour récupérer et construire le fond. Les lignes droites gardent les jambes vives.';
  const etapesTxt = x.pas.map((p, i) => `<div class="ligne"><span class="rond">${i + 1}</span><span class="txt"><b>${p.rep
    ? `${p.rep} × ${pasTxt(p.pas[0], al)}` : pasTxt(p, al)}</b>${p.rep ? `<small>récupération : ${pasTxt(p.pas[1], al).toLowerCase()} entre chaque</small>` : ''}</span></div>`).join('');
  app.innerHTML = `<div class="page">
    <div class="haut"><button class="retour" data-a="retour">‹ Retour</button><span class="compteur">Semaine ${x.sem} sur ${COURSE.at(-1).sem}</span></div>
    <p class="sur">${dateFr(x.d)}${x.allegee ? ', semaine allégée' : ''}</p>
    <h1>${x.titre}</h1>
    <p class="sous">Environ ${dureeRun(x, al)} min</p>
    <p class="info conseil">${but}</p>
    ${etapesTxt}
    <p class="info"><span>Sur la montre :</span> ${nomMontre(x)}</p>
    ${x.test ? `<div class="graph"><p class="titre">Ton chrono sur 5 km</p><p class="lecture">${te ? 'Enregistré : ' + mmss(te.s) + ' (' + mmss(te.s / 5) + ' /km)' : 'Par exemple 23:40'}</p>
      <div class="saisie"><input id="chrono5" inputmode="numeric" placeholder="mm:ss" value="${te ? mmss(te.s) : ''}" aria-label="Chrono en minutes et secondes">
      <button data-a="runChrono">Enregistrer</button></div></div>` : ''}
    ${f ? `<div class="actions-exo"><span class="compteur">Fait le ${dateFr(f, { day:'numeric', month:'long' })}</span><button class="retirer" data-a="runAnnuler">Annuler</button></div>` : ''}
  </div>
  ${f || x.test ? '' : '<div class="bas"><button class="principal" data-a="runFait">C\'est fait</button></div>'}`;
}
const BUTS = { I:'Fractionné : fait monter ta VO2 max, la clé du 5 km. Les récupérations se font en trottinant.', T:'Seuil : apprendre à tenir vite plus longtemps. Dur mais contrôlé.',
  A5:'Allure 5 km visée : caler le rythme de la course pour qu\'il devienne naturel.' };

// ---------- actions ----------
const premiereAFaire = s => etapes(s).findIndex(st => !faite(s, st));
function textePartage() {
  const { cycle, s } = semaine(), l = seancesFaites();
  const lignes = MOUVEMENTS.map(e => { const h = histoMouvement(e.id); if (!h.length) return '';
    const maxs = h.map(x => Math.max(...x.sets.map(y => num(y[0])))), d = maxs.at(-1) - maxs[0];
    return maxs.at(-1) ? `${e.n} : ${kgFr(maxs.at(-1))} kg${h.length > 1 && d ? ` (${d > 0 ? '+' : ''}${kgFr(d)} kg)` : ''}` : ''; }).filter(Boolean);
  return [`Progrès de ${PROF.actif}, cycle ${cycle} semaine ${s} : ${l.length} séance${l.length > 1 ? 's' : ''}`, ...lignes].join(String.fromCharCode(10));
}
const ACTIONS = {
  choisir: b => creerProfil(b.dataset.n),
  profil: b => { const n = b.dataset.n; if (n === PROF.actif) return;
    if (!PROF.liste.includes(n)) PROF.liste.push(n); PROF.actif = n; sauverProfils(); location.reload(); },
  partager: async () => { const t = textePartage();
    try { if (navigator.share) await navigator.share({ text: t }); else { await navigator.clipboard.writeText(t); alert('Copié, tu peux le coller dans un message.'); } } catch {} },
  onglet: b => aller(b.dataset.v),
  run: b => aller('run', { rid: b.dataset.id }),
  runFait: () => { D.course.faits[etat.rid] = AUJ; sauver(); navigator.vibrate?.(20); history.back(); },
  runAnnuler: () => { delete D.course.faits[etat.rid]; delete D.course.tests[etat.rid]; sauver(); rendre(); },
  runChrono: () => { const inp = document.getElementById('chrono5'), m = inp.value.trim().match(/^(\d{1,2})\D*(\d{2})$/);
    const s = m ? +m[1] * 60 + +m[2] : 0;
    if (!m || +m[2] > 59 || s < 600 || s > 3600) { inp.value = ''; inp.placeholder = 'Format mm:ss, ex. 23:40'; return inp.focus(); }
    D.course.tests[etat.rid] = { d: AUJ, s }; D.course.faits[etat.rid] = AUJ; sauver(); rendre(); },
  ouvrir: b => aller('seance', { s: b.dataset.s }),
  retour: () => history.back(),
  bilan: b => aller('bilan', { s: b.dataset.s, d: b.dataset.d }),
  mouv: b => aller('mouv', { id: b.dataset.id }),
  continuer: () => { const j = premiereAFaire(etat.s); j < 0 ? aller('bilan', { d: AUJ }) : aller('exo', { pos: j }); },
  exo: b => { const i = +b.dataset.i, E = etapes(etat.s);
    let j = E.findIndex(st => st.i === i && !faite(etat.s, st)); if (j < 0) j = E.findIndex(st => st.i === i);
    aller('exo', { pos: j }); },
  aller: b => aller('exo', { pos: +b.dataset.j }, true),
  alt: b => { const s = etat.s, E = etapes(s), i = E[etat.pos].i, prevu = P[s][i], id = b.dataset.id, k = AUJ + '|' + s;
    const m = (D.alt[k] ||= {}); if (id === prevu.id) delete m[prevu.id]; else m[prevu.id] = id;
    if (!Object.keys(m).length) delete D.alt[k];
    sauver(); navigator.vibrate?.(15);
    let j = E.findIndex(st => st.i === i && !faite(s, st)); if (j < 0) j = E.findIndex(st => st.i === i);
    aller('exo', { pos: j }, true); },
  pas: b => { const inp = document.getElementById(b.dataset.c), d = +b.dataset.d;
    const x = Math.max(0, Math.round((num(inp.value) + d) * 10) / 10); inp.value = b.dataset.c === 'kg' ? kgFr(x) : x;
    inp.dispatchEvent(new Event('input')); navigator.vibrate?.(8); },
  poids: () => { const v = num(document.getElementById('pc').value); if (!v) return document.getElementById('pc').focus();
    D.poids[AUJ] = v; sauver(); rendre(); },
  retirer: () => { const s = etat.s, st = etapes(s)[etat.pos], j = duJour(s, L(s)[st.i]);
    if (j[st.k]) j[st.k][2] = 0; sauver(); rendre(); },
  valider: () => {
    son(true);
    const s = etat.s, E = etapes(s), st = E[etat.pos], e = L(s)[st.i];
    const kg = num(document.getElementById('kg').value), r = Math.round(num(document.getElementById('r').value));
    if (!r) return document.getElementById('r').focus();
    const deja = faite(s, st);
    const j = ((D.log[cle(s, e)] ||= {})[AUJ] ||= []);
    for (let k = 0; k <= st.k; k++) j[k] ||= ['', '', 0];
    j[st.k] = [String(kg), String(r), 1];
    const m = (D.seances[AUJ + '|' + s] ||= { t0: Date.now() }); m.t1 = Date.now();
    sauver(); navigator.vibrate?.(20);
    let n = -1;
    for (let d = 1; d <= E.length; d++) { const c = (etat.pos + d) % E.length; if (!faite(s, E[c])) { n = c; break; } }
    if (n < 0) return aller('bilan', { d: AUJ }, true);
    aller('exo', { pos: n }, true);
    if (st.repos && !deja) { const nx = E[n], ne = L(s)[nx.i]; ouvrirRepos(st.repos, `${ne.n}, série ${nx.k + 1}`); }
  },
};
document.addEventListener('click', ev => { const b = ev.target.closest('[data-a]'); if (b && ACTIONS[b.dataset.a]) ACTIONS[b.dataset.a](b); });

// ---------- repos ----------
const R = document.getElementById('repos'), ARC = document.getElementById('arc'), C = 2 * Math.PI * 112;
ARC.style.strokeDasharray = C;
let finR = 0, totR = 1, tic;
function ouvrirRepos(sec, suivant) {
  totR = sec; finR = Date.now() + sec * 1000;
  document.getElementById('suivant').innerHTML = `Ensuite<b>${suivant}</b>`;
  R.hidden = false; clearInterval(tic); tic = setInterval(majRepos, 200); majRepos();
}
function majRepos() {
  const rest = Math.max(0, (finR - Date.now()) / 1000), r = Math.ceil(rest);
  document.getElementById('chrono').textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0');
  ARC.style.strokeDashoffset = C * (1 - rest / totR);
  if (rest <= 0) { fermerRepos(); son(); navigator.vibrate?.([300, 120, 300]); }
}
function fermerRepos() { clearInterval(tic); R.hidden = true; }
R.addEventListener('click', ev => { const b = ev.target.closest('[data-r]'); if (!b) return;
  const d = +b.dataset.r; if (!d) return fermerRepos();
  finR = Math.max(Date.now(), finR + d * 1000); totR = Math.max(totR, (finR - Date.now()) / 1000); majRepos(); });

// petit bip de fin de repos (le contexte audio doit naître d'un appui)
let ctx;
function son(preparer) {
  try { ctx ||= new (window.AudioContext || window.webkitAudioContext)(); if (preparer) return ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .5);
    o.start(); o.stop(ctx.currentTime + .5);
  } catch {}
}

// écran allumé pendant l'exercice
let verrou;
async function eveil(on) {
  try { if (on && !verrou && document.visibilityState === 'visible') { verrou = await navigator.wakeLock.request('screen'); verrou.onrelease = () => verrou = null; }
    else if (!on && verrou) { await verrou.release(); verrou = null; } } catch {}
}
document.addEventListener('visibilitychange', () => { eveil(etat.v === 'exo'); if (!R.hidden) majRepos(); });

rendre();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  // dès qu'une nouvelle version prend la main, la page se recharge toute seule
  const avait = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (avait) location.reload(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update());
}
</script>
